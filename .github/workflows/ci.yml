---
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "roles/**"
      - "molecule/**"
      - ".github/**"
  pull_request:
    branches: [main, master]
    paths:
      - "roles/**"
      - "molecule/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: true
        default: "main"

jobs:
  molecule:
    strategy:
      matrix:
        platform: ["uut-ct0", "uut-ct1", "uut-ct2"]
      fail-fast: false
      max-parallel: 3
    uses: jackaltx/solti-matrix-mgr/.github/workflows/molecule-test.yml@ci-sprint
    with:
      platform: ${{ matrix.platform }}
      artifact_prefix: "monitoring"
      container_runtime: "docker"
    secrets: inherit
