# solti-docs.yml — harvest manifest for the solti-docs unified documentation site
#
# harvest.py (solti-docs repo) reads this file to know which sections from this
# collection to pull into solti.jackaltx.com. Each collection declares what it
# wants to surface publicly; everything else stays local.
#
# NOTE: CLAUDE.md is now private (removed from git tracking) — update sources
# when the CLAUDE.md → collection-docs/ pattern is wired into the harvester.

title: "Monitoring Stack"
section: "Monitoring"
nav_order: 1
description: "Metrics collection and log aggregation — Telegraf, InfluxDB3, Loki, Alloy, Grafana"

sources:
  - file: CLAUDE.md
    sections:
      - "Components"
      - "Quick Start Workflow"
      - "Test-Then-Deploy Workflow"
      - "State Management Pattern"
      - "Verification Systems"
      - "Supported Platforms"
  - file: docs/METRICS_COLLECTION_STRATEGY.md
    title: "Metrics Collection Strategy"
  - file: docs/matrix-events.md
    title: "Matrix Integration"
  - file: docs/HISTORY.md
    title: "Development History"
  - file: galaxy.yml
    type: metadata

